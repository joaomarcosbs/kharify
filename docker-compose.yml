services:
  db:
    image: postgres:15-alpine
    container_name: kharify-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kharify
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kharify-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kharify"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: kharify-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/kharify?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - PORT=3080
      - FRONTEND_URL=http://localhost:3000
      # Opcional: remova o comentário e configure para habilitar login com Google
      # - GOOGLE_CLIENT_ID=seu-client-id.apps.googleusercontent.com
    ports:
      - "3080:3080"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3080/v1
        # Opcional: remova o comentário e configure para habilitar login com Google
        # - NEXT_PUBLIC_GOOGLE_CLIENT_ID=seu-client-id.apps.googleusercontent.com
    container_name: kharify-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3080/v1
      - INTERNAL_API_URL=http://api:3080/v1
      # Opcional: remova o comentário e configure para habilitar login com Google
      # - NEXT_PUBLIC_GOOGLE_CLIENT_ID=seu-client-id.apps.googleusercontent.com
    ports:
      - "3000:3000"

  proxy:
    image: nginx:alpine
    container_name: kharify-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  kharify-pgdata: